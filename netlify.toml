# Monorepo: app em apps/web (Vite + React SPA)
[build]
  base = "apps/web"
  command = "npm ci && npm run build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "20"

# Client-side routing (react-router); sem isto, /login e rotas diretas dão 404
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
